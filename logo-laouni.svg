<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"
     aria-label="Laouni Électricité Moderne">
  <title>Laouni Électricité Moderne</title>

  <!-- Soleil : 12 rayons, alternance long / court comme sur l'emballage -->
  <g stroke="#E65814" stroke-width="9" stroke-linecap="round">
    <line x1="210" y1="18"  x2="210" y2="46"/>
    <line x1="253" y1="30"  x2="245" y2="53"/>
    <line x1="290" y1="53"  x2="270" y2="73"/>
    <line x1="316" y1="88"  x2="293" y2="96"/>
    <line x1="330" y1="128" x2="302" y2="128"/>
    <line x1="316" y1="168" x2="293" y2="160"/>
    <line x1="290" y1="203" x2="270" y2="183"/>
    <line x1="253" y1="226" x2="245" y2="203"/>
    <line x1="210" y1="238" x2="210" y2="210"/>
    <line x1="167" y1="226" x2="175" y2="203"/>
    <line x1="130" y1="203" x2="150" y2="183"/>
    <line x1="104" y1="168" x2="127" y2="160"/>
    <line x1="90"  y1="128" x2="118" y2="128"/>
    <line x1="104" y1="88"  x2="127" y2="96"/>
    <line x1="130" y1="53"  x2="150" y2="73"/>
    <line x1="167" y1="30"  x2="175" y2="53"/>
  </g>

  <!-- Couronne orange et disque bleu nuit -->
  <circle cx="210" cy="128" r="64" fill="#E65814"/>
  <circle cx="210" cy="128" r="54" fill="#1A2333"/>

  <!-- Monogramme BB -->
  <g fill="none" stroke="#E65814" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 100 v56 M178 100 h20 l10 8 v9 l-10 8 h-20
             M198 125 h22 l10 8 v10 l-10 13 h-42"/>
    <path d="M212 100 v56 M212 100 h20 l10 8 v9 l-10 8 h-20
             M232 125 h22 l10 8 v10 l-10 13 h-42" transform="translate(24,0)"/>
  </g>

  <!-- Nom de la marque -->
  <text x="210" y="258" text-anchor="middle" font-family="Syne, Arial, sans-serif"
        font-size="46" font-weight="800" letter-spacing="6" fill="#1A2333">LAOUNI</text>
  <text x="210" y="284" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="15" font-weight="700" letter-spacing="4.2" fill="#E65814">ÉLECTRICITÉ MODERNE</text>
</svg>
